name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Shellcheck
        run: shellcheck -S warning bin/oc-delegate install.sh test/stub/opencode test/oc-delegate.bats bench/*.sh
      - name: Tests
        run: bats test
